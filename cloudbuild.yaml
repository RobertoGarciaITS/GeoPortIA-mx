steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, docker/Dockerfile, -t, '${_IMAGE}', .]
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_IMAGE}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=CORS_ALLOW_ORIGINS=${_CORS_ALLOW_ORIGINS}'
images: ['${_IMAGE}']
substitutions:
  _REGION: us-central1
  _SERVICE: geoportia-api
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/geoportia/geoportia-api:$SHORT_SHA
  _CORS_ALLOW_ORIGINS: https://example.web.app
options:
  logging: CLOUD_LOGGING_ONLY
